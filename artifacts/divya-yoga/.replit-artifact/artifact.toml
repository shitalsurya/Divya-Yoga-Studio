kind = "web"
previewPath = "/"
title = "Archana's Divya Yoga Studio"
description = "PWA for Archana's Divya Yoga Studio — personalized onboarding flow, main yoga app, push notifications, i18n (EN/HI/MR), installable as a PWA."
version = "1.0.0"
id = "artifacts/divya-yoga"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23739

[services.development]
run = "pnpm --filter @workspace/divya-yoga run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/divya-yoga", "run", "build" ]
serve = "static"
publicDir = "artifacts/divya-yoga/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23739"
BASE_PATH = "/"
